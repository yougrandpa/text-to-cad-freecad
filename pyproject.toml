[project]
name = "tcad"
version = "0.1.0"
description = "Chat-driven parametric CAD generation agent harness on top of FreeCAD"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    # Keep the provider adapter on the validated SDK major/HTTP transport.
    "openai>=1.40,<3",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
animation = ["av>=12"]
webgl = ["playwright>=1.50,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx[socks]>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The execution sandbox denies writes to the OS temp dir, which is where pytest
# puts tmp_path by default. Pinning basetemp inside the repo keeps `tmp_path`
# usable (many tests here rely on real files: STEP round-trips, SQLite, PNGs).
addopts = "--basetemp=output/local/pytest_tmp"
cache_dir = "output/local/pytest_cache"
markers = [
    "contract: needs a real FreeCADCmd process (slow)",
]

[tool.setuptools.packages.find]
include = ["tcad*"]

[tool.setuptools.package-data]
tcad = ["server/ui/*", "viewer/package.json", "viewer/core/*.js", "viewer/core/*.json", "viewer/hosts/*.js", "agent/contracts/*.md"]
