<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 42" fill="none">
  <title>哈基米 · tcad</title>
  <style>
    .kitten { transform-origin: 21px 32px; animation: kitten-tilt 7.2s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: kitten-blink 4.8s ease-in-out infinite; }
    .eye-right { animation-delay: .035s; }
    @keyframes kitten-blink {
      0%, 38%, 44%, 48%, 54%, 100% { transform: scaleY(1); }
      41%, 51% { transform: scaleY(.08); }
    }
    @keyframes kitten-tilt {
      0%, 15%, 55%, 100% { transform: rotate(0deg) translateY(0); }
      28%, 40% { transform: rotate(-5deg) translateY(-.5px); }
      70%, 82% { transform: rotate(3deg) translateY(-.5px); }
    }
    @media (prefers-reduced-motion: reduce) { .kitten, .eye { animation: none; } }
  </style>
  <g class="kitten">
    <path d="M6 18 5 6Q5 3 8 5l8 6a23 23 0 0 1 10 0l8-6q3-2 3 1l-1 12c3 4 3 10 0 14-6 7-24 7-30 0-3-4-3-10 0-14Z" fill="#fae6cf" stroke="#b4432c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m8 9 1 8 5-4Zm26 0-6 4 5 4Z" fill="#e9aa9b"/>
    <path d="m18 12 1.5 3m3-3L21 15m5-2-1 2" stroke="#d39564" stroke-width="1.7" stroke-linecap="round"/>
    <ellipse cx="10" cy="28" rx="3.7" ry="2.1" fill="#efb1a0" opacity=".75"/>
    <ellipse cx="32" cy="28" rx="3.7" ry="2.1" fill="#efb1a0" opacity=".75"/>
    <g class="eye eye-left">
      <ellipse cx="13.5" cy="23" rx="2.6" ry="3.3" fill="#47352d"/>
      <circle cx="12.7" cy="21.9" r=".9" fill="#fffaf4"/>
      <circle cx="14.3" cy="24.3" r=".4" fill="#fffaf4"/>
    </g>
    <g class="eye eye-right">
      <ellipse cx="28.5" cy="23" rx="2.6" ry="3.3" fill="#47352d"/>
      <circle cx="27.7" cy="21.9" r=".9" fill="#fffaf4"/>
      <circle cx="29.3" cy="24.3" r=".4" fill="#fffaf4"/>
    </g>
    <path d="M19 27q2-1 4 0l-2 2Z" fill="#b4432c"/>
    <path d="M21 29v1q-2.5 3-4.5 0m4.5 0q2.5 3 4.5 0" fill="none" stroke="#9a533e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="m2 25 6 1m-5 5 5-2m26-3 6-1m-6 4 5 2" stroke="#b4432c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M13 36q8 4 16 0" fill="none" stroke="#b4432c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="21" cy="38.5" r="2.5" fill="#e6b75d" stroke="#a86f2c" stroke-width=".8"/>
    <path d="M21 39v1" stroke="#a86f2c" stroke-width=".8" stroke-linecap="round"/>
  </g>
  <!-- A drawn wordmark: rounded construction lines, a single drafting accent. -->
  <g stroke="#282c2b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 12v16q0 4 5 4m-9-14h11"/>
    <path d="M75 19c-9-5-14 0-14 7s5 10 14 5"/>
    <path d="M93 32V22c0-7-14-7-14 4s14 10 14 0"/>
    <path d="M113 10v22m0-10c0-7-14-7-14 4s14 10 14 0"/>
  </g>
